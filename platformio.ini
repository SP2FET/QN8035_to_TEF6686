; QN8035 -> TEF6686 bridge (ESP-IDF via PlatformIO)
;
; The project is a plain ESP-IDF project (main/ + components/), so it also
; builds with `idf.py build` from an ESP-IDF v5.4 shell. Keep it that way:
; configuration lives in sdkconfig.defaults / Kconfig, not in build_flags.

[platformio]
src_dir = main
default_envs = lolin_s2_mini

[env:lolin_s2_mini]
; espressif32 6.10.0 ships ESP-IDF v5.4.0. Pin it; upgrade deliberately.
platform = espressif32@6.10.0
board = lolin_s2_mini
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
; Files embedded with EMBED_TXTFILES in components/web_ui/CMakeLists.txt
board_build.embed_txtfiles =
    components/web_ui/www/index.html
monitor_speed = 115200
upload_port = COM15
monitor_filters = esp32_exception_decoder
; pio_cmake_stamp: keeps CMake from re-configuring on every build (see its header)
; pio_ota: `pio run -e lolin_s2_mini -t ota` flashes over Wi-Fi (web OTA)
; pio_archive: keeps the ELF of every USB-flashed build in builds/ (core dumps)
extra_scripts =
    post:scripts/pio_cmake_stamp.py
    post:scripts/pio_ota.py
    post:scripts/pio_archive.py
; Bridge address for the ota target; $OTA_HOST overrides (e.g. its station LAN IP)
custom_ota_host = 192.168.4.1
; test/native/* runs on the host only (env:native)
test_ignore = native/*

; Host-side unit tests for the hardware-independent modules
; (QN8035 register model, RDS decoder, memory channels, AF selection,
; reception tuning table):  pio test -e native
; Only components with no ESP-IDF dependency may be listed in lib_deps here.
[env:native]
platform = native
test_framework = unity
test_build_src = no
lib_extra_dirs = components
lib_deps =
    qn8035_emu
    rds
    presets
    af
    tuning
    trace
lib_compat_mode = off
test_filter = native/*
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
